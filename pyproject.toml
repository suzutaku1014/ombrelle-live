[project]
name = "ombrelle-live"
version = "0.1.0"
description = "現実を印象派に変換するリアルタイム処理系 — OpenCV → PyTorch → OpenGL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "moderngl>=5.10",
    "glfw>=2.7",
    "pillow>=10.3",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.44",
]

[tool.uv]
package = false
